<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <link
      rel="shortcut icon"
      href="./icons/LC-favicon-48x48.ico"
      type="image/x-icon"
    />
    <script src="./js/index.js" type="module"></script>
    <title>Leader Classic</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <button
          class="header__burger burger"
          aria-label="Бургер-меню"
          aria-expanded="false"
          aria-controls="header__controls"
        >
          <svg>
            <use
              class="burger__icon-menu"
              href="./icons/burger-menu-icon.svg#menu-burger"
            ></use>
            <use
              class="burger__icon-cross"
              href="./icons/burger-menu-icon.svg#menu-cross"
            ></use>
          </svg>
        </button>
        <a href="/" class="logo header__logo">
          <svg class="header__logo-icon">
            <use class="logo-icon" href="./icons/logo-icon.svg#logo"></use>
          </svg>
          <h2 class="header__icon-text">Leader <br />Classic</h2>
        </a>
        <div class="burger__elements">
          <button class="header__lang">
            <svg class="header__lang-country-icon" width="23" height="23">
              <use
                class="lang-country-icon"
                href="./icons/rus-icon.svg#rus-icon"
              ></use>
            </svg>
            <p class="header__lang-text">RU</p>
            <svg class="lang__arrow-icon" width="22" height="22">
              <use href="./icons/arrow-down-icon.svg#arrow-down"></use>
            </svg>
          </button>
          <nav
            class="nav header__nav"
            id="header__nav"
            aria-label="Главное меню"
          >
            <ul class="nav__list">
              <li class="nav__item">
                <a class="nav__link" href="#tariffs">Тарифы</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#bonus">Бонус</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#referral">Реферальная</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#referral">Контакты</a>
              </li>
            </ul>
          </nav>
        </div>

        <div class="controls header__controls">
          <button class="controls__button">Войти</button>
          <button class="controls__button controls__button--accent">
            Открыть счёт
          </button>
        </div>
      </div>
    </header>
    <main class="main">
      <section class="hero">
        <div class="card-gift hero__card-gift">
            <picture>
              <img
                class="card-gift__img"
                src="./images/gift.png"
                alt="Подарок с желтым бантиком"
              />
            </picture>
            <div class="card-gift__text">
              <p class="card-gift__text--top">
                Станьте миллионером с Leader Classic
              </з>
              <p class="card-gift__text--bottom">
                Откройте счет, инвестируйте в фонды Leader Classic и получите
                шанс выиграть один из 100 000 000 &#8381;
              </p>
            </div>
            <p class="card-gift__countdown">
              27<span class="card-gift__countdown--small"> д </span>: 07<span class="card-gift__countdown--small"> д </span>: 40<span class="card-gift__countdown--small"> м </span>: 49<span class="card-gift__countdown--small"> c </span>
            </p>
          </div>
        <div class="container hero__container">
        </div>
      </section>
    </main>
  </body>
</html>
