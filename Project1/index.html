<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <link
      rel="shortcut icon"
      href="./icons/LC-favicon-48x48.ico"
      type="image/x-icon"
    />
    <script src="./js/index.js" type="module"></script>
    <title>Leader Classic</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <button
          class="header__burger burger"
          aria-label="Бургер-меню"
          aria-expanded="false"
          aria-controls="header__controls"
        >
          <svg>
            <use
              class="burger__icon-menu"
              href="./icons/burger-menu-icon.svg#menu-burger"
            ></use>
            <use
              class="burger__icon-cross"
              href="./icons/burger-menu-icon.svg#menu-cross"
            ></use>
          </svg>
        </button>
        <a href="/" class="logo header__icon">
          <svg class="header__logo-icon">
            <use class="logo-icon" href="./icons/logo-icon.svg#logo"></use>
          </svg>
          <h2 class="header__icon-text">Leader <br />Classic</h2>
        </a>
        <div class="controls header__controls" id="header__controls">
          <button class="header__lang">
            <svg class="header__lang-country-icon" width="23" height="23">
              <use
                class="lang-country-icon"
                href="./icons/rus-icon.svg#rus-icon"
              ></use>
            </svg>
            <p class="header__lang-text">RU</p>
            <svg class="lang__arrow-icon" width="22" height="22">
              <use href="./icons/arrow-down-icon.svg#arrow-down"></use>
            </svg>
          </button>
          <nav class="menu header__menu" aria-label="Главное меню">
            <ul class="menu__list">
              <li class="menu__item">
                <a class="menu__link" href="#tariffs">Тарифы</a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#bonus">Бонус</a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#referral">Реферальная</a>
              </li>
            </ul>
          </nav>
          <a class="header__accent-link" href="/">
            <span class="header__accent-text">Контакты</span> ✨</a
          >
        </div>
        <div class="personal header__personal">
          <button class="personal__button">Войти</button>
          <button class="personal__button personal__button--accent">
            Открыть счёт
          </button>
        </div>
      </div>
    </header>
  </body>
</html>
